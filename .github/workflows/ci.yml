name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Lint · Build · Unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sinh Prisma Client
        run: npm run prisma:generate
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  e2e:
    name: E2E (PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/langoo_test
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/langoo_test
      JWT_ACCESS_SECRET: ci-only-secret-0123456789abcdef0123456789
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sinh Prisma Client
        run: npm run prisma:generate
      - name: Nạp DB test từ dump mẫu
        run: npm run db:test:reset
      - name: Đảm bảo db:migrate không còn file cần chạy (đủ 025)
        run: npm run db:migrate
      - run: npm run test:e2e
